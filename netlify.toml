[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev --package-lock=false"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/client/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Content-Type-Options = "nosniff"

# Rotas públicas do painel para as Netlify Functions.
# O status 200 faz uma reescrita interna, mantendo /api/... no navegador.
[[redirects]]
  from = "/api/admin/whatsapp"
  to = "/.netlify/functions/admin-whatsapp"
  status = 200
  force = true

[[redirects]]
  from = "/api/whatsapp"
  to = "/.netlify/functions/whatsapp"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/stats"
  to = "/.netlify/functions/admin-stats"
  status = 200
  force = true

